<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <!-- ✅ VIEWPORT CORREGIDO: ancho fijo 412, escalado natural -->
    <meta name="viewport" content="width=412, initial-scale=1.0, user-scalable=yes">
    <title>Control Remoto Boomerang</title>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        /* ═══════════ FUENTE OPTICIAN SANS (título) ═══════════ */
        @font-face {
            font-family: 'OpticianSans';
            src: url('/OpticianSans.woff') format('woff');
            font-weight: normal;
            font-style: normal;
            font-display: block;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            font-family: system-ui, -apple-system, sans-serif;
            background: #111;
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;  /* centrado vertical nativo */
            user-select: none;
            -webkit-user-select: none;
        }

        /* Título BOOMERANG VISION */
        .remote-title {
            font-family: 'OpticianSans', 'Arial Black', Impact, sans-serif;
            font-size: 16px;
            font-weight: normal;
            color: #ccc;
            letter-spacing: 2px;
            text-align: center;
            margin-top: 12px;
            margin-bottom: 16px;
        }

        /* Estado del emparejamiento */
        #pair-bar {
            display:flex; align-items:center; justify-content:center; gap:10px;
            font-size:11px; color:#888; margin-bottom:10px;
        }
        #pair-state.ok { color:#2ecc71; }
        #pair-state.warn { color:#e67e22; }
        #pair-code { font-family:monospace; letter-spacing:2px; color:#666; }
        /* Panel para teclear el código si no vino en el QR */
        #pair-ask {
            position:fixed; inset:0; z-index:200; background:rgba(0,0,0,0.92);
            display:flex; flex-direction:column; align-items:center; justify-content:center;
            gap:14px; padding:24px; text-align:center;
        }
        #pair-ask.hidden { display:none; }
        #pair-ask h2 { font-size:16px; font-weight:600; color:#fff; }
        #pair-ask p { font-size:12px; color:#999; line-height:1.6; max-width:320px; }
        #pair-input {
            font-family:monospace; font-size:28px; letter-spacing:8px; text-align:center;
            width:220px; padding:10px; border-radius:10px; border:2px solid #444;
            background:#1a1a1a; color:#fff; text-transform:uppercase;
        }
        #pair-go {
            background:#2980b9; color:#fff; border:none; border-radius:8px;
            padding:12px 28px; font-size:14px; font-weight:700;
        }
        #pair-error { font-size:12px; color:#e74c3c; min-height:16px; }

        /* Contenedor principal */
        #remote-screen {
            width: 94%;
            max-width: 500px;
            height: auto;
            min-height: 260px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: #000;
            border-radius: 12px;
            margin-bottom: 16px;
            padding: 8px 4px;
            overflow: hidden;
        }
        #remote-screen img { filter: invert(1); }

        .remote-line {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            gap: 12px;
        }
        .remote-row {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
        }
        .remote-row img {
            display: block;
            flex-shrink: 0;
        }
        .remote-text {
            font-family: 'OpticianSans', 'Arial Black', Impact, sans-serif;
            font-weight: normal;
            color: #fff;
            line-height: 1;
            display: block;
        }
        .remote-line.dimmed .remote-text,
        .remote-line.dimmed img { opacity: 0.10; }

        .remote-ann-left, .remote-ann-right {
            font-family: 'Segoe UI', 'Helvetica Neue', sans-serif;
            font-weight: 600;
            width: 45px;
            text-align: center;
            font-size: 12px;
            color: #aaa;
            flex-shrink: 0;
        }

        /* Botones de modo */
        .mode-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 6px;
            width: 94%;
            max-width: 400px;
            margin-bottom: 16px;
        }
        .mode-grid button {
            font-size: 13px;
            font-weight: 700;
            padding: 9px 0;
            border: none;
            border-radius: 8px;
            background: #333;
            color: #fff;
        }
        .mode-grid button.active-mode { background: #2980b9; }

        /* Cruz direccional */
        .dpad {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(3, 1fr);
            gap: 6px;
            width: 60vmin;
            height: 60vmin;
            max-width: 220px;
            max-height: 220px;
            margin-bottom: 16px;
        }
        .dpad button {
            font-size: 28px;
            border: none;
            border-radius: 8px;
            background: #2980b9;
            color: #fff;
        }
        .dpad button:active { background: #3498db; transform: scale(0.92); }
        .dpad .empty { background: transparent; pointer-events: none; }

        /* Botones de función (inferiores) */
        .function-btns {
            display: flex;
            width: 94%;
            max-width: 400px;
            gap: 6px;
            margin-top: 0;
            margin-bottom: 10px;      /* pequeño margen para no pegar al borde */
        }
        .function-btns button {
            flex: 1;
            font-size: 12px;
            font-weight: 700;
            padding: 11px 0;
            border: 2px solid transparent;
            border-radius: 8px;
            background: #444;
            color: #fff;
        }
        .function-btns button.active-func { border-color: #f1c40f; }
        .function-btns button.special {
            background: linear-gradient(to right, #e74c3c 50%, #2ecc71 50%);
            color: #fff;
        }
    </style>
</head>
<body>

    <div class="remote-title">BOOMERANG VISION</div>

    <div id="pair-bar">
        <span id="pair-state">conectando…</span>
        <span id="pair-code"></span>
    </div>

    <div id="remote-screen"></div>

    <div class="mode-grid" id="mode-buttons">
        <button data-mode="letters" class="active-mode">Letras</button>
        <button data-mode="numbers">Números</button>
        <button data-mode="pediatric">Figuras</button>
        <button data-mode="e_directional">E direc.</button>
    </div>

    <div class="dpad">
        <div class="empty"></div><button onclick="enviar('ArrowUp')">▲</button><div class="empty"></div>
        <button onclick="enviar('ArrowLeft')">◀</button><div class="empty"></div><button onclick="enviar('ArrowRight')">▶</button>
        <div class="empty"></div><button onclick="enviar('ArrowDown')">▼</button><div class="empty"></div>
    </div>

    <div class="function-btns" id="func-buttons">
        <button id="btn-resaltar" onclick="enviar('KeyR')">🔦 Resaltar</button>
        <button id="btn-individual" onclick="enviar('KeyU')">👤 Individual</button>
        <button id="btn-bic" class="special" onclick="enviar('KeyB')"></button>
    </div>

    <div id="pair-ask" class="hidden">
        <h2>Código de la pantalla</h2>
        <input id="pair-input" maxlength="5" inputmode="latin" autocapitalize="characters"
               autocomplete="off" spellcheck="false" placeholder="—————">
        <button id="pair-go">Conectar</button>
        <div id="pair-error"></div>
        <p>Lo muestra la pantalla del PC en el panel del botón <strong>?</strong>,
           debajo del QR. Normalmente no hace falta teclearlo: basta escanear.</p>
    </div>

    <script>
        /* ═══════════ EMPAREJAMIENTO ═══════════
           El servidor solo reenvía dentro de la sala del código, así que este
           mando maneja una pantalla y no todas las que haya conectadas. El
           código llega en el QR (?c=) y se guarda para las siguientes veces. */
        const PAIR_LEN = 5;
        const PAIR_RE = /^[ABCDEFGHJKLMNPQRSTUVWXYZ23456789]{5}$/;
        const limpiar = c => String(c || '').toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, PAIR_LEN);
        const guardado = () => { try { return localStorage.getItem('bv_pair') || ''; } catch (e) { return ''; } };
        let codigo = limpiar(new URLSearchParams(location.search).get('c')) || limpiar(guardado());

        const elEstado = document.getElementById('pair-state');
        const elCodigo = document.getElementById('pair-code');
        const elAsk = document.getElementById('pair-ask');
        const elError = document.getElementById('pair-error');

        function pintarEstado(texto, clase) {
            elEstado.textContent = texto;
            elEstado.className = clase || '';
            elCodigo.textContent = codigo || '';
        }

        // Si socket.io no carga, el mando no puede hacer nada, pero al menos
        // lo dice en vez de reventar con cada pulsación.
        const socket = typeof io !== 'undefined' ? io() : null;
        if (!socket) pintarEstado('sin conexión con el servidor', 'warn');

        function unirse(c) {
            codigo = limpiar(c);
            if (!PAIR_RE.test(codigo)) { elError.textContent = 'El código son ' + PAIR_LEN + ' caracteres.'; return false; }
            elError.textContent = '';
            if (socket) socket.emit('join', codigo);
            return true;
        }

        function enviar(cmd) {
            if (!socket || !PAIR_RE.test(codigo)) return;
            socket.emit('comando', cmd);
            if (window.navigator?.vibrate) window.navigator.vibrate(15);
        }

        document.getElementById('pair-go').addEventListener('click', () => unirse(document.getElementById('pair-input').value));
        document.getElementById('pair-input').addEventListener('keydown', e => {
            if (e.key === 'Enter') unirse(e.target.value);
        });

        document.querySelectorAll('#mode-buttons button').forEach(btn => {
            btn.addEventListener('click', () => enviar('Mode:' + btn.dataset.mode));
        });

        if (socket) {
            socket.on('connect', () => {
                if (PAIR_RE.test(codigo)) { pintarEstado('emparejando…'); socket.emit('join', codigo); }
                else { pintarEstado('falta el código', 'warn'); elAsk.classList.remove('hidden'); }
            });
            socket.on('joined', (sala) => {
                codigo = sala;
                try { localStorage.setItem('bv_pair', sala); } catch (e) {}
                elAsk.classList.add('hidden');
                pintarEstado('esperando la pantalla…', 'warn');
                socket.emit('requestScreenUpdate');
            });
            socket.on('joinError', () => {
                pintarEstado('código no válido', 'warn');
                elAsk.classList.remove('hidden');
                elError.textContent = 'Ese código no existe. Revíselo en la pantalla.';
            });
            socket.on('peers', (n) => {
                if (n >= 2) pintarEstado('pantalla conectada', 'ok');
                else pintarEstado('esperando la pantalla…', 'warn');
            });
            socket.on('disconnect', () => pintarEstado('sin conexión', 'warn'));
        }

        socket?.on('modo', (modo) => {
            document.querySelectorAll('#mode-buttons button').forEach(btn => {
                btn.classList.toggle('active-mode', btn.dataset.mode === modo);
            });
        });

        function updateFuncButtons(state) {
            document.getElementById('btn-resaltar')?.classList.toggle('active-func', state.highlightMode);
            document.getElementById('btn-individual')?.classList.toggle('active-func', state.singleCharMode);
            document.getElementById('btn-bic')?.classList.toggle('active-func', state.bichromatic);
        }

        /* El espejo no está a escala: es una vista previa y todas las líneas se
           dibujan igual de grandes. Lo que sí tiene que cuadrar es que letras y
           figuras midan aprox. lo mismo entre sí, con el mismo criterio que la
           pantalla del paciente: INK_PX es la altura de la tinta, no el
           cuadratín. Aquí basta el ratio nominal de la fuente (las redondas
           salen un 6% mayores); la medida por glifo solo hace falta en la
           pantalla del paciente, que es la que mide. */
        const INK_PX = 20;
        const CAP_HEIGHT_RATIO = 0.5;   // Optician Sans: mayúsculas = 500/1000 del cuadratín
        function optotypeBoxPx(aspect, ink){
            return aspect >= 1 ? { w: ink, h: ink/aspect }
                               : { w: ink*aspect, h: ink };
        }

        socket?.on('screenUpdate', (data) => {
            const container = document.getElementById('remote-screen');
            container.innerHTML = '';
            if (!data?.lines) return;

            const gap = 12;
            container.style.gap = gap + 'px';

            data.lines.forEach((line, li) => {
                const lineDiv = document.createElement('div');
                lineDiv.className = 'remote-line';
                lineDiv.style.gap = gap + 'px';

                if (data.highlightMode && li !== data.highlightLineIdx) {
                    lineDiv.classList.add('dimmed');
                }

                const leftAnn = document.createElement('div');
                leftAnn.className = 'remote-ann-left';
                let denominator = line.snellen;
                if (denominator && denominator.includes('/')) {
                    denominator = denominator.split('/')[1];
                }
                leftAnn.textContent = denominator;

                const row = document.createElement('div');
                row.className = 'remote-row';
                row.style.gap = gap + 'px';

                let chars = line.chars;
                if (data.singleCharMode) chars = [chars[0]];

                chars.forEach(ch => {
                    if (ch.type === 'text') {
                        const span = document.createElement('span');
                        span.className = 'remote-text';
                        span.textContent = ch.char;
                        span.style.fontSize = (INK_PX / CAP_HEIGHT_RATIO) + 'px';
                        row.appendChild(span);
                    } else {
                        const img = document.createElement('img');
                        const box = optotypeBoxPx(ch.aspect || 1, INK_PX);
                        img.style.height = box.h + 'px';
                        img.style.width = box.w + 'px';
                        img.style.display = 'block';
                        if (ch.rot) img.style.transform = `rotate(${ch.rot}deg)`;
                        img.src = ch.uri || '';
                        row.appendChild(img);
                    }
                });

                const rightAnn = document.createElement('div');
                rightAnn.className = 'remote-ann-right';
                rightAnn.textContent = line.decimal.toFixed(2);

                lineDiv.appendChild(leftAnn);
                lineDiv.appendChild(row);
                lineDiv.appendChild(rightAnn);
                container.appendChild(lineDiv);
            });

            updateFuncButtons(data);
        });


    </script>
</body>
</html>
